name: Weekly database backups

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-database-backups
  cancel-in-progress: false

jobs:
  main-host:
    name: Backup main host databases
    runs-on: [self-hosted, mei-backend]
    timeout-minutes: 60
    # Each database is independently attempted. A legacy DB failure must never
    # suppress the unrelated Mei backup, and must still fail the overall job.
    steps:
      - name: Back up local Solange production database
        run: /home/ubuntu/.local/bin/shopvivaliz-db-backup.py --profile main --target solange-production

      - name: Verify legacy local Solange demo database backup
        if: ${{ !cancelled() }}
        run: /home/ubuntu/.local/bin/shopvivaliz-db-backup.py --profile main --target solange-staging

      - name: Back up Mei email database independently
        if: ${{ !cancelled() }}
        run: /home/ubuntu/.local/bin/shopvivaliz-db-backup.py --profile main --target mei-email

  secondary-host:
    name: Backup secondary host databases
    runs-on: [self-hosted, mei-ci]
    timeout-minutes: 30
    steps:
      - name: Run verified secondary database backups
        run: /home/ubuntu/.local/bin/shopvivaliz-db-backup.py --profile secondary
