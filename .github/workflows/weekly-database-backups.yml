name: Weekly database backups

on:
  schedule:
    # Allow the existing systemd Mei backup timer (Sun 04:30 UTC) to finish.
    - cron: '15 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-database-backups
  cancel-in-progress: false

jobs:
  main-host:
    name: Backup main host databases
    runs-on: [self-hosted, mei-backend]
    timeout-minutes: 60
    # Solange local targets are attempted independently; failure remains RED.
    # Mei is already backed up by a separate systemd single writer at 04:30 UTC.
    # Verify that offsite artifact, never start a duplicate uploader here.
    steps:
      - name: Check out read-only backup verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Back up local Solange production database
        run: python3 scripts/ops/shopvivaliz-db-backup.py --profile main --target solange-production

      - name: Verify legacy local Solange demo database backup
        if: ${{ !cancelled() }}
        run: python3 scripts/ops/shopvivaliz-db-backup.py --profile main --target solange-staging

      - name: Verify independent Mei email backup without a second writer
        if: ${{ !cancelled() }}
        run: python3 scripts/verify-mei-systemd-backup.py

  secondary-host:
    name: Verify Marina MLRR systemd database backup
    runs-on: [self-hosted, mei-ci]
    timeout-minutes: 30
    # The MLRR writer already runs on Marina on Sunday at 04:30 UTC.
    # Never launch a second writer to the same OCI Object Storage key.
    steps:
      - name: Check out read-only MLRR backup verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Marina MLRR systemd backup without a second writer
        run: python3 scripts/verify-mlrr-systemd-backup.py
